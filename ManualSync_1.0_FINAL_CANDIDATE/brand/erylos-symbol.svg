<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ERYLOS">
  <!-- ERYLOS "Strati": three layers of structured content; the middle one is
       shifted -- the layer being reused and transformed. For light grounds. -->
  <g stroke-linejoin="round" stroke-width="0.8">
    <polygon points="6,6 24,6 22,10.5 4,10.5" fill="#15161C" stroke="#15161C"/>
    <polygon points="10,14 28,14 26,18.5 8,18.5" fill="#7C5CFF" stroke="#7C5CFF"/>
    <polygon points="6,22 24,22 22,26.5 4,26.5" fill="#15161C" stroke="#15161C"/>
  </g>
</svg>
